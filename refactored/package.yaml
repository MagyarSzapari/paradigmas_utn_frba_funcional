name:                paradigms-functional
version:             1.0.0
synopsis:            Refactored Haskell coursework for Paradigmas de Programacion (UTN FRBA)
license:             BSD3

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wredundant-constraints

library:
  source-dirs: src

tests:
  paradigms-functional-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - paradigms-functional
    - hspec
    - QuickCheck
    build-tools:
    - hspec-discover:hspec-discover
